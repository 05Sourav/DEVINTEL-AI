services:
  # ── PostgreSQL ───────────────────────────────────────────
  postgres:
    image: postgres:16
    container_name: devintel_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: devintel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Qdrant ───────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: devintel_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  # ── FastAPI Backend ───────────────────────────────────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: devintel_api
    restart: unless-stopped
    env_file: ./api/.env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    volumes:
      - ./api:/app

volumes:
  postgres_data:
  qdrant_data:
